<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>NPcalculator MCtoolchain</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/png" href="../assets/images/mctc.png">
        <script src="../js/script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>NPcalculator</h1>
        </header>
        <hr>
        <main>
            <section>
                <label for="xcoord">Enter X coordinate:</label>
                <input type="number" id="xcoord" name="xcoord">
                <br>
                <label for="zcoord">Enter Z coordinate:</label>
                <input type="number" id="zcoord" name="zcoord">
                <br>
                <button type="button" id="otn">Overworld to Nether</button>
                <button type="button" id="nto">Nether to Overworld</button>
                <p>Calculated:<br><span id="np"></span></p>
            </section>
        </main>
        <hr>
        <footer>
            <a href="../index.html">#Home</a>
        </footer>
    </body>
</html>
